services:
  - type: web
    name: prospect
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: Prospect
      - key: NEXT_PUBLIC_APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
